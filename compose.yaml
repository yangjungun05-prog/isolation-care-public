services:
  db:
    # 【판단】 버전을 18 로 못박아 두 사람이 같은 PostgreSQL 을 쓴다 (latest 는 언젠가 바뀐다)
    image: postgres:18
    environment:
      # 【기능】 처음 켤 때 이 계정·비밀번호·DB 를 만든다. 개발용이라 단순하게
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: AgentDB
    ports:
      # 【문법】 "내 컴퓨터 포트:상자 안 포트"
      - "5432:5432"
    volumes:
      # 【기능】 DB 파일을 pgdata 라는 저장 공간에 둬서 상자를 꺼도 자료가 남는다
      # 【판단】 18 부터는 /var/lib/postgresql 에 붙인다 (17 이하에서 쓰던 .../data 가 아님)
      - pgdata:/var/lib/postgresql
      # 【기능】 db/ 폴더의 .sql 파일을 처음 켤 때 한 번 자동 실행한다 (README.md 는 건너뜀)
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: